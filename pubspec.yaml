name: cross_website
description: A new jaspr project.
version: 1.0.0

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_sound: ^9.25.4
  flutter_svg: ^2.0.17
  audioplayers: ^6.3.0
  cloud_firestore: ^6.0.0
  csv: ^6.0.0
  dart_firebase_admin: ^0.4.1
  emailjs: ^4.0.0
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1
  highlight: ^0.7.0
  http: ^1.3.0
  jaspr: ^0.23.4
  jaspr_flutter_embed: 0.4.11
  jaspr_router: ^0.9.0
  js_interop: ^0.0.1
  just_audio: ^0.10.4
  markdown: ^7.3.0
  record: ^6.0.0
  rxdart: ^0.28.0
  universal_web: ^1.1.0+2
  volume_controller: ^3.3.1
  web: ^1.1.0

dev_dependencies:
  build_runner: ^2.15.1
  build_web_compilers: ^4.8.5
  jaspr_builder: ^0.23.4
  jaspr_test: ^0.23.4
  jaspr_lints: ^0.7.2
  jaspr_riverpod: ^0.4.6

jaspr:
  mode: static

# jaspr_cli 0.23.4 requires build_daemon >=4.1.3, but jaspr_builder 0.23.4 caps
# analyzer at ^12.x, which forces build_runner <=2.15.1 (build_daemon 4.0.4).
# Override until jaspr_builder ships an analyzer 13+ compatible release.
dependency_overrides:
  build_daemon: ^4.1.4
